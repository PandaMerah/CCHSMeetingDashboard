<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - CCHS Meeting Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="admin-container">
    <header class="admin-header">
      <div class="header-brand">
        <img src="careclinic-logo.webp" alt="Care Clinics Logo" class="brand-logo-small" onerror="this.style.display='none'">
        <h2>Dashboard Administration</h2>
      </div>
      <div class="header-actions">
        <a href="index.html" target="_blank" class="secondary-btn">Open TV View</a>
        <a href="input.html" target="_blank" class="secondary-btn">Open Staff Input</a>
      </div>
    </header>

    <div id="statusAlert" class="alert-box" style="display: none;"></div>

    <main class="admin-grid">
      <!-- Left Column: Display Toggles & General Config -->
      <section class="admin-card">
        <h3>Display Features</h3>
        <div class="toggle-list">
          <label class="switch-label">
            <input type="checkbox" id="toggleQnA">
            <span>Show Q&A Sections on Dashboard</span>
          </label>
          <label class="switch-label">
            <input type="checkbox" id="togglePhrases">
            <span>Show Core Values / Daily Phrases</span>
          </label>
          <label class="switch-label">
            <input type="checkbox" id="toggleVM">
            <span>Show Vision & Mission Banner</span>
          </label>
          <label class="switch-label">
            <input type="checkbox" id="toggleSpeech">
            <span>Show Top Announcement / Speech</span>
          </label>
        </div>

        <h3 class="section-divider">Content Customization</h3>
        <div class="form-group">
          <label for="visionText">Vision Statement</label>
          <textarea id="visionText" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="missionText">Mission Statement</label>
          <textarea id="missionText" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="phrasesText">Phrases (Comma or line separated)</label>
          <textarea id="phrasesText" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="speechText">Live Announcement Banner Text</label>
          <textarea id="speechText" rows="2" placeholder="e.g. Townhall will commence at 3:00 PM"></textarea>
        </div>

        <button id="saveConfigBtn" class="primary-btn">Save Configuration</button>
      </section>

      <!-- Right Column: Departments & Reset Actions -->
      <section class="admin-card">
        <div class="card-header-flex">
          <h3>Manage Departments</h3>
          <button id="resetSessionBtn" class="danger-btn">Reset Meeting Session</button>
        </div>
        <p class="description">Resetting clears updates for all departments to "Pending update..." while preserving your history.</p>

        <div class="add-dept-form">
          <input type="text" id="newDeptName" placeholder="New Department Name">
          <button id="addDeptBtn" class="secondary-btn">Add Department</button>
        </div>

        <div id="deptListContainer" class="dept-badge-list">Loading...</div>

        <h3 class="section-divider">Submission Audit Log</h3>
        <div id="auditLog" class="audit-log-container">Loading history...</div>
      </section>
    </main>
  </div>

  <script type="module">
    import { db, ref, onValue, get, update, set } from './firebase.js';

    const statusAlert = document.getElementById('statusAlert');
    const toggleQnA = document.getElementById('toggleQnA');
    const togglePhrases = document.getElementById('togglePhrases');
    const toggleVM = document.getElementById('toggleVM');
    const toggleSpeech = document.getElementById('toggleSpeech');
    const visionText = document.getElementById('visionText');
    const missionText = document.getElementById('missionText');
    const phrasesText = document.getElementById('phrasesText');
    const speechText = document.getElementById('speechText');
    const saveConfigBtn = document.getElementById('saveConfigBtn');
    const resetSessionBtn = document.getElementById('resetSessionBtn');
    const deptListContainer = document.getElementById('deptListContainer');
    const newDeptName = document.getElementById('newDeptName');
    const addDeptBtn = document.getElementById('addDeptBtn');
    const auditLog = document.getElementById('auditLog');

    let cachedData = null;

    function notify(msg, isError = false) {
      statusAlert.textContent = msg;
      statusAlert.className = `alert-box ${isError ? 'error' : 'success'}`;
      statusAlert.style.display = 'block';
      setTimeout(() => { statusAlert.style.display = 'none'; }, 4000);
    }

    // Realtime sync to fill admin state
    onValue(ref(db, '/'), (snapshot) => {
      cachedData = snapshot.val() || { config: {}, departments: {}, history: [] };
      const config = cachedData.config || {};
      const depts = cachedData.departments || {};
      const history = cachedData.history || [];

      // Only update fields if not actively focused
      if (document.activeElement !== visionText) visionText.value = config.visionText || '';
      if (document.activeElement !== missionText) missionText.value = config.missionText || '';
      if (document.activeElement !== speechText) speechText.value = config.lastMinuteSpeechText || '';
      if (document.activeElement !== phrasesText) {
        phrasesText.value = Array.isArray(config.phrases) ? config.phrases.join(', ') : '';
      }

      toggleQnA.checked = config.showQnA !== false;
      togglePhrases.checked = config.showDailyPhrases !== false;
      toggleVM.checked = config.showVisionMission !== false;
      toggleSpeech.checked = config.showLastMinuteSpeech !== false;

      // Render Department Badges
      const deptKeys = Object.keys(depts);
      deptListContainer.innerHTML = deptKeys.map(name => `
        <div class="dept-badge">
          <span>${name}</span>
          <button type="button" class="del-dept-btn" data-dept="${name}">&times;</button>
        </div>
      `).join('');

      // Render Audit Log
      if (history.length === 0) {
        auditLog.innerHTML = '<p class="empty-note">No history entries logged.</p>';
      } else {
        auditLog.innerHTML = history.slice(0, 15).map(h => `
          <div class="audit-item">
            <div class="audit-head">
              <strong>${h.department}</strong>
              <small>${h.dateString}</small>
            </div>
            <p>${h.update}</p>
            ${h.question && h.question !== 'N/A' ? `<p class="audit-q"><strong>Q:</strong> ${h.question}</p>` : ''}
          </div>
        `).join('');
      }
    });

    // Save Settings
    saveConfigBtn.addEventListener('click', async () => {
      saveConfigBtn.disabled = true;
      saveConfigBtn.textContent = 'Saving...';

      try {
        const phrases = phrasesText.value
          .split(/[\n,]+/)
          .map(p => p.trim())
          .filter(Boolean);

        const configUpdates = {
          showQnA: toggleQnA.checked,
          showDailyPhrases: togglePhrases.checked,
          showVisionMission: toggleVM.checked,
          showLastMinuteSpeech: toggleSpeech.checked,
          visionText: visionText.value.trim(),
          missionText: missionText.value.trim(),
          phrases: phrases,
          lastMinuteSpeechText: speechText.value.trim()
        };

        await update(ref(db, 'config'), configUpdates);
        notify("Admin configuration saved!");
      } catch (err) {
        notify("Save failed: " + err.message, true);
      } finally {
        saveConfigBtn.disabled = false;
        saveConfigBtn.textContent = 'Save Configuration';
      }
    });

    // Add Department
    addDeptBtn.addEventListener('click', async () => {
      const name = newDeptName.value.trim().toUpperCase();
      if (!name) return;

      try {
        await set(ref(db, `departments/${name}`), {
          update: "Pending update...",
          question: "N/A"
        });
        newDeptName.value = '';
        notify(`Added department: ${name}`);
      } catch (err) {
        notify("Failed to add department: " + err.message, true);
      }
    });

    // Remove Department
    deptListContainer.addEventListener('click', async (e) => {
      if (e.target.classList.contains('del-dept-btn')) {
        const dept = e.target.getAttribute('data-dept');
        if (confirm(`Are you sure you want to remove "${dept}"?`)) {
          try {
            await set(ref(db, `departments/${dept}`), null);
            notify(`Removed department: ${dept}`);
          } catch (err) {
            notify("Failed to remove department: " + err.message, true);
          }
        }
      }
    });

    // Reset Session Updates
    resetSessionBtn.addEventListener('click', async () => {
      const confirmReset = confirm("Reset all department updates to 'Pending update...' for a new meeting session?");
      if (!confirmReset) return;

      resetSessionBtn.disabled = true;
      try {
        const deptsSnap = await get(ref(db, 'departments'));
        const depts = deptsSnap.val() || {};
        const updates = {};

        for (const dept in depts) {
          updates[`departments/${dept}`] = {
            update: "Pending update...",
            question: "N/A"
          };
        }

        await update(ref(db), updates);
        notify("Meeting session reset for all departments!");
      } catch (err) {
        notify("Failed to reset session: " + err.message, true);
      } finally {
        resetSessionBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
