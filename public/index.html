<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCHS Meeting Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
  <!-- Header Banner -->
  <header class="dashboard-header">
    <div class="header-brand">
      <img src="careclinic-logo.webp" alt="Care Clinics Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="header-titles">
        <h1 class="main-title">CARE CLINICS HEALTHCARE SERVICES</h1>
        <h2 class="sub-title">Monthly Management Meeting Dashboard</h2>
      </div>
    </div>
    <div class="header-meta">
      <div id="liveClock" class="live-clock">--:--:--</div>
      <div id="liveDate" class="live-date">Loading...</div>
      <div class="live-pill"><span class="pulse-dot"></span> LIVE SYNC</div>
    </div>
  </header>

  <!-- Vision & Mission Banner -->
  <section id="visionMissionSection" class="banner-section vision-mission-banner" style="display: none;">
    <div class="vm-card">
      <span class="vm-label">VISION</span>
      <p id="visionText" class="vm-text"></p>
    </div>
    <div class="vm-card">
      <span class="vm-label">MISSION</span>
      <p id="missionText" class="vm-text"></p>
    </div>
  </section>

  <!-- Daily Phrases Banner -->
  <section id="dailyPhrasesSection" class="banner-section phrases-banner" style="display: none;">
    <span class="banner-tag">CORE VALUE</span>
    <div id="phrasesContainer" class="phrases-container"></div>
  </section>

  <!-- Last Minute Speech Banner -->
  <section id="lastMinuteSpeechSection" class="banner-section speech-banner" style="display: none;">
    <span class="banner-tag highlight">ANNOUNCEMENT</span>
    <p id="lastMinuteSpeechText" class="speech-text"></p>
  </section>

  <!-- Main Departments Grid -->
  <main class="dashboard-main">
    <div id="departmentsGrid" class="departments-grid">
      <div class="loading-state">Connecting to dashboard feed...</div>
    </div>
  </main>

  <footer class="dashboard-footer">
    <span>Staff Input Portal: <code>/input.html</code></span>
    <span>Admin Management: <code>/admin.html</code></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
