<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>Care Clinics Group - Weekly Alignment</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Left Navy Sidebar -->
<div class="sidebar">
    <div>
        <div class="brand-header">
            <!-- White Logo Card with Icon & Styled Text -->
            <div class="brand-logo-card">
                <img src="/careclinic-logo.webp" alt="Care Clinics Logo" class="sidebar-logo-icon">
                <div class="brand-logo-text">
                    <span class="logo-text-primary">careclinics</span>
                    <span class="logo-text-secondary">healthcare services</span>
                </div>
            </div>

            <div class="brand-subtitle">Weekly Alignment</div>
            
            <div class="sidebar-clock-container">
                <div class="sidebar-time" id="sidebar-time">--:--:--</div>
                <div class="sidebar-date" id="sidebar-date">-----, -- ---- ----</div>
            </div>
        </div>

        <!-- Auto-generating Slide Navigation -->
        <div class="dept-pill-list" id="sidebar-menu"></div>
    </div>

    <div class="sidebar-footer">
        IT Careclinics Healthcare Services Sdn Bhd
    </div>
</div>

        <!-- Right Main Viewport -->
        <div class="main-viewport">
            <div id="slides-container"></div>
        </div>
    </div>

    <!-- On-Screen TV Navigation Overlay -->
    <div class="tv-controls">
        <button onclick="changeSlide(-1)">❮</button>
        <span id="slide-indicator">1 / 1</span>
        <button onclick="changeSlide(1)">❯</button>
        <button onclick="toggleFullScreen()">⛶</button>
        <button id="btn-autoplay" onclick="toggleAutoPlay()">▶ Auto</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
