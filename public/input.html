<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Department Data</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 50px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
        button { background: #102141; color: white; border: none; padding: 15px; cursor: pointer; width: 100%; border-radius: 5px; margin-top: 10px;}
        button:hover { background: #93c01f; }
        .history-section { background: #eef2f5; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Submit Weekly Update</h2>
        
        <label>Select Department:</label>
        <select id="department" onchange="loadHistoryDropdown()">
            <option value="IT Support">IT Support</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Operations">Operations</option>
        </select>

        <div class="history-section">
            <label>Load Previous Update (Optional):</label>
            <select id="historyDropdown" onchange="populateFromHistory()">
                <option value="">-- Select a past update --</option>
            </select>
        </div>

        <label>Update Text:</label>
        <textarea id="updateText" rows="4"></textarea>

        <label>Department Specific Question:</label>
        <input type="text" id="questionText">

        <button onclick="submitUpdate()">Save & Broadcast Live to TV</button>
        <p id="status"></p>
    </div>

    <script>
        let fullHistory = [];

        // Fetch data on load
        fetch('/api/data').then(r => r.json()).then(data => {
            fullHistory = data.history;
            loadHistoryDropdown();
        });

        function loadHistoryDropdown() {
            const dept = document.getElementById('department').value;
            const dropdown = document.getElementById('historyDropdown');
            dropdown.innerHTML = '<option value="">-- Select a past update --</option>';
            
            // Filter history by selected department
            const deptHistory = fullHistory.filter(h => h.department === dept);
            
            deptHistory.forEach((item, index) => {
                dropdown.innerHTML += `<option value="${index}">${item.dateString}</option>`;
            });
        }

        function populateFromHistory() {
            const dropdown = document.getElementById('historyDropdown');
            const dept = document.getElementById('department').value;
            const deptHistory = fullHistory.filter(h => h.department === dept);
            
            if (dropdown.value !== "") {
                const selectedData = deptHistory[dropdown.value];
                document.getElementById('updateText').value = selectedData.update;
                document.getElementById('questionText').value = selectedData.question;
            }
        }

        async function submitUpdate() {
            const data = {
                department: document.getElementById('department').value,
                updateText: document.getElementById('updateText').value,
                questionText: document.getElementById('questionText').value
            };

            const response = await fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById('status').innerText = result.message;
            document.getElementById('status').style.color = "green";
        }
    </script>
</body>
</html>
