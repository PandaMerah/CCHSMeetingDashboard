<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Meeting Submission - CCHS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="form-body">
  <div class="form-wrapper">
    <header class="form-header">
      <img src="careclinic-logo.webp" alt="Care Clinics Logo" class="brand-logo-small" onerror="this.style.display='none'">
      <h2>Staff Meeting Submission</h2>
      <p>Submit your department updates and questions for the upcoming management meeting.</p>
    </header>

    <div id="alertBox" class="alert-box" style="display: none;"></div>

    <form id="submissionForm" class="submission-form">
      <div class="form-group">
        <label for="departmentSelect">Select Department <span class="required">*</span></label>
        <select id="departmentSelect" required>
          <option value="" disabled selected>Loading departments...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="updateText">Monthly Updates & Activities <span class="required">*</span></label>
        <textarea id="updateText" rows="6" placeholder="- Key updates for this month&#10;- Action items completed&#10;- Ongoing initiatives" required></textarea>
        <small class="hint">Tip: Start lines with "-" or "•" to display bullet points on the TV dashboard.</small>
      </div>

      <div class="form-group">
        <label for="questionText">Questions / Matters Arising (Q&A)</label>
        <textarea id="questionText" rows="3" placeholder="Optional: Any questions or requests for management? (Enter 'N/A' if none)"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="primary-btn">Broadcast Update to TV</button>
    </form>

    <section class="recent-history-section">
      <h3>Recent Submissions</h3>
      <div id="recentHistoryList" class="history-preview-list">Loading submissions...</div>
    </section>
  </div>

  <script type="module">
    import { db, ref, onValue, get, set } from './firebase.js';

    const deptSelect = document.getElementById('departmentSelect');
    const form = document.getElementById('submissionForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const recentHistoryList = document.getElementById('recentHistoryList');

    function showAlert(message, isError = false) {
      alertBox.textContent = message;
      alertBox.className = `alert-box ${isError ? 'error' : 'success'}`;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    // Default fallback departments if database is empty
    const DEFAULT_DEPTS = [
      "CEO OFFICE", "ADMIN", "BUSINESS LEGAL", "PMI TEAM", "BUSINESS DEVELOPMENT",
      "CORPORATE HEALTH", "FINANCE", "ACCOUNT", "PROCUREMENT", "TALENT DEVELOPMENT",
      "CLINICAL GOVERNANCE", "OPERATION", "HR", "IT", "TPP SYSTMONE", "FRANCHISE", "FACILITY"
    ];

    // Listen for available departments and recent history
    onValue(ref(db, '/'), (snapshot) => {
      const data = snapshot.val() || {};
      const depts = data.departments ? Object.keys(data.departments) : DEFAULT_DEPTS;
      
      const currentSelection = deptSelect.value;
      deptSelect.innerHTML = '<option value="" disabled selected>-- Select your department --</option>' +
        depts.map(d => `<option value="${d}">${d}</option>`).join('');
      
      if (currentSelection && depts.includes(currentSelection)) {
        deptSelect.value = currentSelection;
      }

      // Render recent history
      const history = data.history || [];
      if (history.length === 0) {
        recentHistoryList.innerHTML = '<p class="empty-note">No recent submissions found.</p>';
      } else {
        recentHistoryList.innerHTML = history.slice(0, 5).map(item => `
          <div class="history-item-preview">
            <div class="hist-header">
              <strong>${item.department}</strong>
              <small>${item.dateString}</small>
            </div>
            <p class="hist-text">${item.update}</p>
          </div>
        `).join('');
      }
    });

    // Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const department = deptSelect.value;
      const updateText = document.getElementById('updateText').value.trim();
      const questionText = document.getElementById('questionText').value.trim() || 'N/A';

      if (!department) {
        showAlert("Please select a department.", true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Broadcasting...";

      try {
        const rootRef = ref(db, '/');
        const snapshot = await get(rootRef);
        const data = snapshot.val() || { config: {}, departments: {}, history: [] };

        if (!data.departments) data.departments = {};
        data.departments[department] = {
          update: updateText,
          question: questionText
        };

        if (!data.history) data.history = [];
        data.history.unshift({
          timestamp: Date.now(),
          dateString: new Date().toLocaleString('en-MY'),
          department: department,
          update: updateText,
          question: questionText
        });

        await set(rootRef, data);

        showAlert("Success! Update broadcasted to dashboard.");
        document.getElementById('updateText').value = '';
        document.getElementById('questionText').value = '';
      } catch (err) {
        console.error(err);
        showAlert("Error saving submission: " + err.message, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Broadcast Update to TV";
      }
    });
  </script>
</body>
</html>
